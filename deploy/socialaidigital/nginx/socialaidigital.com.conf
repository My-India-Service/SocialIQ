# SocialAiDigital (SocialIQ): static site + API (PM2 socialaidigital-api on :5600).
# Independent of the Unaffected Healthcare sites on the same server.
# TLS: Cloudflare Origin Certificate (zone socialaidigital.com, SSL mode Full (strict)).

server {
    listen 80;
    listen [::]:80;
    server_name socialaidigital.com www.socialaidigital.com new.socialaidigital.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name socialaidigital.com www.socialaidigital.com new.socialaidigital.com;

    ssl_certificate /etc/ssl/socialaidigital/origin.pem;
    ssl_certificate_key /etc/ssl/socialaidigital/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/socialaidigital;
    index index.html;

    client_max_body_size 10m;

    if ($host = socialaidigital.com) {
        return 301 https://www.socialaidigital.com$request_uri;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ ^/app(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
