# SocialAiDigital — Render Blueprint (service names kept as voxa-* to match existing services)
# Docs: docs/RENDER_DEPLOYMENT.md
# After create: set secrets in the dashboard, then redeploy.

services:
  - type: web
    name: voxa-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://www.socialaidigital.com,https://socialaidigital.com
      - key: SERVER_URL
        value: https://socialiq-37aa.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://socialiq-37aa.onrender.com/api/connections/youtube/callback
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_REDIRECT_URI
        value: https://socialiq-37aa.onrender.com/api/connections/meta/callback
      - key: META_INSTAGRAM_APP_ID
        sync: false
      - key: META_INSTAGRAM_APP_SECRET
        sync: false
      - key: META_INSTAGRAM_REDIRECT_URI
        value: https://socialiq-37aa.onrender.com/api/connections/instagram/callback
      - key: META_GRAPH_API_VERSION
        value: v21.0
      # Instagram DMs need instagram_business_manage_messages approved in App Review first.
      - key: META_INSTAGRAM_MESSAGING_ENABLED
        value: "false"
      - key: META_INSTAGRAM_WEBHOOK_VERIFY_TOKEN
        sync: false
      # WhatsApp stays hidden until WHATSAPP_ENABLED=true; its keys are then required.
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: CRISIS_MONITOR_ENABLED
        value: "true"
      - key: ALERT_EMAIL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: REPORT_FROM
        sync: false

  - type: web
    name: voxa-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://socialiq-37aa.onrender.com
